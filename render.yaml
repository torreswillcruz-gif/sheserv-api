services:
  - type: web
    name: marketplace-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
  - type: web
    name: sheserve-admin-api
    runtime: node
    rootDir: ./admin-api
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: JWT_SECRET
        sync: false
      # URL pública da marketplace-api, usada pelo login do painel /admin
      # (ex.: https://sheserv-api.onrender.com)
      - key: MARKETPLACE_API_URL
        sync: false
